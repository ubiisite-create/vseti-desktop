name: VSeti Windows release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Номер готовой сборки (run id)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VSeti-Windows-x64
          path: VSeti
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Zip
        run: |
          ls -la VSeti
          zip -r -9 VSeti-Windows.zip VSeti
          sha256sum VSeti-Windows.zip | tee VSeti-Windows.zip.sha256
      - name: Publish release "windows-latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete windows-latest -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create windows-latest -R "$GITHUB_REPOSITORY" --title "VSети для Windows" \
            --notes "Сборка ${{ inputs.run_id }}" VSeti-Windows.zip VSeti-Windows.zip.sha256
